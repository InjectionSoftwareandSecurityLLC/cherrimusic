<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHERRI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="wall-texture">

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
      <h1 class="loading-title">
        <span class="logo-mark"></span>
        <span class="visually-hidden">CHERRI</span>
      </h1>
      <div class="loading-cherry">
        <svg viewBox="0 0 110 120" width="90" height="90" xmlns="http://www.w3.org/2000/svg">
          <!-- Curved stem to left cherry -->
          <path d="M50 10 C46 25, 32 40, 38 55 C42 65, 36 75, 35 82" fill="none" stroke="#3d6b35" stroke-width="3" stroke-linecap="round"/>
          <!-- Curved stem to right cherry -->
          <path d="M50 10 C58 22, 72 30, 68 45 C65 55, 72 60, 75 68" fill="none" stroke="#3d6b35" stroke-width="3" stroke-linecap="round"/>
          <!-- Leaf pointing up-right -->
          <path d="M50 10 C57 3, 73 -2, 83 5 C85 12, 70 16, 50 10Z" fill="#4a8b3f"/>
          <!-- Left cherry (lower) -->
          <circle cx="35" cy="98" r="18" fill="#c41e3a"/>
          <ellipse cx="29" cy="92" rx="6" ry="4" fill="rgba(255,255,255,0.2)" transform="rotate(-35 29 92)"/>
          <!-- Right cherry (higher) -->
          <circle cx="75" cy="82" r="16" fill="#d4263d"/>
          <ellipse cx="69" cy="77" rx="5" ry="3.5" fill="rgba(255,255,255,0.2)" transform="rotate(-35 69 77)"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="site-nav">
    <a class="nav-logo" href="index.html" aria-label="CHERRI home">
      <span class="logo-mark"></span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="listen.html">Listen</a></li>
      <!-- <li><a href="watch.html">Watch Now</a></li> -->
      <li><a href="shows.html">Shows</a></li>
      <!-- <li><a href="#" target="_blank">Shop</a></li> -->
    </ul>
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="listen.html">Listen</a>
    <!-- <a href="watch.html">Watch Now</a> -->
    <a href="shows.html">Shows</a>
    <!-- <a href="#" target="_blank">Shop</a> -->
  </div>

  <!-- Logo Wall -->
  <section class="logo-wall">
    <div class="wall-photo wall-photo--left" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: -6.5deg; --tape-tilt: 4deg; --tape-x: 42%;">
        <div class="polaroid-photo">
          <div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div>
        </div>
      </div>
    </div>

    <h1 class="logo-wall-title">
      <span class="logo-mark"></span>
      <span class="visually-hidden">CHERRI</span>
    </h1>

    <div class="wall-photo wall-photo--right" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: 5.5deg; --tape-tilt: -6deg; --tape-x: 58%;">
        <div class="polaroid-photo">
          <div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Upcoming Show (revealed only when Bandsintown returns an event) -->
  <section class="hero hero-show flanked upcoming-show" id="upcomingShow">
    <div class="flank flank--left" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: -6deg; --tape-tilt: 5deg; --tape-x: 45%;">
        <div class="polaroid-photo"><div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div></div>
      </div>
    </div>
    <div class="flank flank--right" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: 5deg; --tape-tilt: -6deg; --tape-x: 55%;">
        <div class="polaroid-photo"><div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div></div>
      </div>
    </div>

    <h1>Upcoming Show</h1>
    <a class="sticky-note sticky-note--lg" data-show-link href="#" target="_blank" rel="noopener noreferrer"
       style="--note-color: #ffe14d; --tilt: -2.4deg;">
      <span class="sticky-date" data-show-date></span>
      <span class="sticky-venue" data-show-venue></span>
      <span class="sticky-location" data-show-location></span>
    </a>
    <a class="hero-cta" data-show-link href="#" target="_blank" rel="noopener noreferrer">Get Tickets</a>
  </section>

  <!-- Hero / Latest Release -->
  <section class="hero flanked">
    <div class="flank flank--left" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: -4.5deg; --tape-tilt: 6deg; --tape-x: 45%;">
        <div class="polaroid-photo"><div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div></div>
      </div>
    </div>
    <div class="flank flank--right" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: 4deg; --tape-tilt: -7deg; --tape-x: 60%;">
        <div class="polaroid-photo"><div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div></div>
      </div>
    </div>

    <h1>Latest Release</h1>
    <img class="hero-artwork" src="img/come-around.jpg" alt="Come Around album artwork" width="640" height="640">
    <a class="hero-cta" href="#" target="_blank">Listen Now</a>
  </section>

  <!-- Top Songs -->
  <section class="section flanked">
    <div class="flank flank--left" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: -5.5deg; --tape-tilt: 7deg; --tape-x: 48%;">
        <div class="polaroid-photo"><div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div></div>
      </div>
    </div>
    <div class="flank flank--right" aria-hidden="true">
      <div class="polaroid polaroid--pin" style="--tilt: 7deg; --tape-tilt: -5deg; --tape-x: 43%;">
        <div class="polaroid-photo"><div class="polaroid-photo-ph"><i class="fas fa-camera"></i></div></div>
      </div>
    </div>

    <h2 class="section-title">Top Songs</h2>
    <div class="spotify-section">
      <iframe style="border-radius:12px"
              src="https://open.spotify.com/embed/artist/0mDwdgreP6g5GfIZf0KYL7?utm_source=generator&theme=0"
              width="100%" height="352" frameBorder="0"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"></iframe>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-social">

      <a href="https://open.spotify.com/artist/0mDwdgreP6g5GfIZf0KYL7?si=VYFbIjVWT3KN21sfSlJcxA" target="_blank" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
    </div>
    <p class="footer-text">&copy; 2026 CHERRI</p>
    <div class="footer-email">
      <a href="mailto:cherribooking@gmail.com">cherribooking@gmail.com</a>
